# Corpus classification — config-driven replacement for the old hardcoded
# DOC_FAMILIES dict in indexer.py. Read by aria_rag.corpus_mapping.
#
# Each rule maps a folder (or file) PREFIX, relative to Settings.docs_dir
# (Ressources/), forward-slash, NFC-normalized, to a classification:
# family, norm_level (national | local), city, and validity
# (current | superseded | excluded — omit for the default, "current").
#
# Matching: longest matching prefix wins, independent of list order below
# (order here is just for human readability — file-specific overrides are
# listed first since they're the most specific case). A path matching no
# rule classifies as family "other" — aria_rag.check's family-coverage
# invariant treats any family absent from both the retrieval slot config
# and its own documented allowlist as a hard failure, so an unmapped file
# is loud, not silent.
#
# Any validity other than "current" is discovered during ingestion (still a
# valid PDF on disk) but never chunked/indexed — indexer.build_index and
# aria_rag.check's coverage invariant both treat "not current" uniformly, so
# neither flags the file as "missing from manifest". Two distinct reasons so
# far:
#   - superseded: a byte-identical, legally-current replacement exists under
#     a different filename (verified by full-text diff before adding an
#     entry here; see the MS1-vs-base audit for the REG1/REG2A1 case below).
#   - excluded: no replacement exists — the file itself has no substantive
#     indexable content (e.g. a map/plate whose extracted "text" is just its
#     own repeated title banner; see the ANN2A case below), so indexing it
#     would only add retrieval noise, not signal.

rules:
  # --- File-specific overrides: REG1.pdf, REG2A1.pdf, and REG2A10_1DE2.pdf
  # are byte-identical (confirmed via exhaustive page-by-page text diff, 0
  # differences across 250 / 224 / 700 pages respectively) to their _MS1
  # twins, the legally-current "modification simplifiée n°1" consolidations.
  # Same family/norm_level/city as the reglement_ecrit rule below — only
  # validity differs, which is why these need their own longest-prefix
  # entries rather than a folder-level rule.
  #
  # Full MS1 inventory (5 *_MS1 files in the corpus, checked exhaustively):
  #   REG1_MS1.pdf            <- REG1.pdf            byte-identical, superseded (below)
  #   REG2A1_MS1.pdf          <- REG2A1.pdf           byte-identical, superseded (below)
  #   REG2A10_1DE2_MS1.pdf    <- REG2A10_1DE2.pdf     byte-identical, superseded (below)
  #   REG2A10_2DE2_MS1.pdf    <- (no base file exists) standalone, nothing to mark
  #   Rapport_presentation_MS1.pdf <- (no base file exists) standalone change-log
  #     document (itemizes specific edits to Annexe V / atlas plans), not a
  #     version of any Rapport de présentation sub-document — see the
  #     MS1-vs-base audit. Both of these are already "current" by default
  #     via the folder rules below; no entry needed.
  - prefix: "PLU/75 Paris/PLU Bioclimatique/Règlement/Pièces écrites/Tome 1/REG1.pdf"
    family: reglement_ecrit
    norm_level: local
    city: paris
    validity: superseded
  - prefix: "PLU/75 Paris/PLU Bioclimatique/Règlement/Pièces écrites/Tome 2/REG2A1.pdf"
    family: reglement_ecrit
    norm_level: local
    city: paris
    validity: superseded
  - prefix: "PLU/75 Paris/PLU Bioclimatique/Règlement/Pièces écrites/Tome 2/REG2A10_1DE2.pdf"
    family: reglement_ecrit
    norm_level: local
    city: paris
    validity: superseded

  # --- ANN2A_2025_12_19.pdf ("Zonage d'assainissement des eaux usées et
  # zonage pluvial") is a map/plate document — its 4 pre-fix chunks were
  # confirmed to be nothing but the same repeated title banner text
  # ("ZONAGE D'ASSAINISSEMENT DES EAUX USÉES ET ZONAGE PLUVIAL DE LA VILLE
  # DE PARIS...") extracted from each page; the actual content is graphical
  # (a map), which pypdf cannot extract as text. No substantive content to
  # index, and the repeated banner was polluting retrieval as false-signal
  # noise. Same family/norm_level/city as the annexes rule below — only
  # validity differs, hence its own file-specific entry.
  - prefix: "PLU/75 Paris/PLU Bioclimatique/Annexes/Textes et documents illustrés/ANN2A_2025_12_19.pdf"
    family: annexes
    norm_level: local
    city: paris
    validity: excluded

  # --- PLU bioclimatique de Paris (today's corpus) — norm_level: local,
  # city: paris.
  - prefix: "PLU/75 Paris/PLU Bioclimatique/Règlement/Pièces écrites"
    family: reglement_ecrit
    norm_level: local
    city: paris
  - prefix: "PLU/75 Paris/PLU Bioclimatique/Règlement/Documents graphiques"
    family: reglement_graphique
    norm_level: local
    city: paris
  - prefix: "PLU/75 Paris/PLU Bioclimatique/Rapport de présentation"
    family: rapport_presentation
    norm_level: local
    city: paris
  - prefix: "PLU/75 Paris/PLU Bioclimatique/OAP"
    family: oap
    norm_level: local
    city: paris
  - prefix: "PLU/75 Paris/PLU Bioclimatique/PADD"
    family: padd
    norm_level: local
    city: paris
  - prefix: "PLU/75 Paris/PLU Bioclimatique/Annexes"
    family: annexes
    norm_level: local
    city: paris

  # --- Code de la Construction et de l'Habitation (national norm) — the
  # CCH dual-source prototype's second source. Previously fell through to
  # family "other" for lack of any matching DOC_FAMILIES fragment.
  - prefix: "LEGIFRANCE/CCH"
    family: cch
    norm_level: national
    city: null
